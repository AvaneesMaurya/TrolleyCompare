
name: TrolleyCompare CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trolleycompare-${{ github.ref }}
  cancel-in-progress: false

jobs:

  quality-check:
    name: ESLint, Build and SonarQube
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 4. Run ESLint
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      # 5. Build frontend
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 6. Set up Java
      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: "21"

      # 7. Run backend tests
      - name: Run backend tests
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw test

      # 8. Set up Python
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # 9. Install SonarQube scanner dependencies
      - name: Install SonarQube Scanner
        run: |
          python -m pip install --only-binary=:all: \
            --require-hashes \
            -r requirements-ebcli.txt

      # 10. SonarQube analysis
      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  deploy:
    name: Deploy to AWS Elastic Beanstalk
    needs: quality-check
    if: github.event_name != 'pull_request' && needs.quality-check.result == 'success'
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # 3. Install locked EB CLI dependencies
      - name: Install Elastic Beanstalk CLI
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-ebcli.txt

      # 4. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 5. Verify AWS access
      - name: Verify AWS access
        run: aws sts get-caller-identity

      # 6. Configure Elastic Beanstalk
      - name: Configure Elastic Beanstalk
        run: |
          mkdir -p .elasticbeanstalk

          cat > .elasticbeanstalk/config.yml <<'EOF'
          branch-defaults:
            main:
              environment: TrolleyCompare-env-2
          environment-defaults:
            TrolleyCompare-env-2:
              branch: main
              repository: null
          global:
            application_name: TrolleyCompare
            default_region: us-east-1
            default_platform: Docker running on 64bit Amazon Linux 2023
            include_git_submodules: true
            profile: null
            sc: git
            workspace_type: Application
          EOF

      # 7. Deploy application
      - name: Deploy to Elastic Beanstalk
        run: eb deploy TrolleyCompare-env-2 --timeout 30

      # 8. Verify deployment
      - name: Verify deployment
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names TrolleyCompare-env-2 \
            --region us-east-1 \
            --query "Environments[0].[Status,Health,VersionLabel]" \
            --output table
