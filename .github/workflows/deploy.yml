name: Deploy TrolleyCompare to AWS

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${EC2_HOST:?Set the EC2_HOST Actions secret}"
          : "${EC2_USER:?Set the EC2_USER Actions secret}"
          : "${EC2_SSH_PRIVATE_KEY:?Set the EC2_SSH_PRIVATE_KEY Actions secret}"
          : "${EC2_KNOWN_HOSTS:?Set the EC2_KNOWN_HOSTS Actions secret}"
          : "${POSTGRES_PASSWORD:?Set the POSTGRES_PASSWORD Actions secret}"

          key_file="$RUNNER_TEMP/ec2_deploy_key"
          known_hosts_file="$RUNNER_TEMP/ec2_known_hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts_file"
          ssh_options=(-i "$key_file" -o UserKnownHostsFile="$known_hosts_file" -o StrictHostKeyChecking=yes)
          remote="$EC2_USER@$EC2_HOST"

          git archive --format=tar HEAD |
            ssh "${ssh_options[@]}" "$remote" 'mkdir -p ~/app && tar -xf - -C ~/app'

          printf 'POSTGRES_PASSWORD=%s\nVITE_API_ORIGIN=http://%s:8080\nCORS_ALLOWED_ORIGINS=http://%s\n' \
            "$POSTGRES_PASSWORD" "$EC2_HOST" "$EC2_HOST" |
            ssh "${ssh_options[@]}" "$remote" 'umask 077; cat > ~/app/.env'

          ssh "${ssh_options[@]}" "$remote" \
            'cd ~/app && sudo docker compose up -d --build --remove-orphans && sudo docker compose ps'
