
name: Deploy TrolleyCompare to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Elastic Beanstalk CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure Elastic Beanstalk
        run: |
          mkdir -p .elasticbeanstalk

          cat > .elasticbeanstalk/config.yml <<'EOF'
          branch-defaults:
            main:
              environment: TrolleyCompare-env-2
          environment-defaults:
            TrolleyCompare-env-2:
              branch: main
              repository: null
          global:
            application_name: TrolleyCompare
            default_region: us-east-1
            default_platform: Docker running on 64bit Amazon Linux 2023
            include_git_submodules: true
            profile: null
            sc: git
            workspace_type: Application
          EOF

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Deploy to Elastic Beanstalk
        run: |
          eb deploy TrolleyCompare-env-2 --timeout 30

      - name: Verify deployment
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names TrolleyCompare-env-2 \
            --region us-east-1 \
            --query "Environments[0].[Status,Health,VersionLabel]" \
            --output table
